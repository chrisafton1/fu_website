<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 ♡ Page Not Found</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg: #0b0b14;
      --glass: rgba(20, 20, 35, 0.65);
      --glass-border: rgba(90, 70, 160, 0.3);
      --accent: #c678dd;
      --accent2: #e06c9f;
      --pink: #ff6bc0;
      --text: #e0d0ff;
      --text-muted: #b8a8e0;
    }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Flying stars background */
    .stars-bg {
      position: fixed;
      inset: 0;
      perspective: 800px;
      overflow: hidden;
      z-index: 0;
    }

    .star-field {
      position: absolute;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      animation: flyForward 60s linear infinite;
    }

    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 8px #fff, 0 0 16px var(--accent);
    }

    @keyframes flyForward {
      from { transform: translateZ(0); }
      to { transform: translateZ(-2000px); }
    }

    /* Bass-reactive blobs */
    .bg-blob { 
      position: fixed; 
      border-radius: 50%; 
      filter: blur(120px); 
      opacity: 0.25; 
      pointer-events: none; 
      z-index: 1; 
      transition: opacity 0.15s ease-out;
    }
    .blob1 { width: 600px; height: 600px; background: var(--accent); top: -10%; left: -10%; animation: float 22s infinite ease-in-out; }
    .blob2 { width: 800px; height: 800px; background: var(--accent2); bottom: -20%; right: -10%; animation: float 28s infinite ease-in-out reverse; }

    @keyframes float { 0%,100%{transform:translate(0,0) rotate(0deg)} 50%{transform:translate(100px,-100px) rotate(12deg)} }

    /* Drifting space elements */
    .space-drift {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .nebula, .asteroid {
      position: absolute;
      animation: drift linear infinite;
      mix-blend-mode: screen;
    }

    .nebula { opacity: 0.15; }
    .asteroid { opacity: 0.35; }

    @keyframes drift {
      from { transform: translate(100vw, 100vh) rotate(0deg); }
      to { transform: translate(-100vw, -100vh) rotate(360deg); }
    }

    .container {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .card {
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 4rem 5rem;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7);
      animation: fadeInUp 1.5s ease-out;
    }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }

    .error-code {
      font-size: 8rem;
      font-weight: 800;
      background: linear-gradient(90deg, #c678dd, #e06c9f, #ff6bc0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -5px;
      line-height: 1;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 600;
      color: var(--text);
      margin: 1.5rem 0 1rem;
    }

    p {
      font-size: 1.2rem;
      color: var(--text-muted);
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }

    .btn-home {
      display: inline-block;
      padding: 1.1rem 2.5rem;
      background: rgba(198, 120, 221, 0.25);
      border: 1px solid var(--accent);
      border-radius: 20px;
      color: var(--text);
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.4s ease;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }

    .btn-home:hover {
      transform: translateY(-8px) scale(1.05);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      background: rgba(198, 120, 221, 0.35);
    }

    .btn-home i { margin-right: 10px; }

    footer {
      margin-top: 4rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .heart {
      color: var(--pink);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.4); } }

    /* Now Playing Widget */
    .now-playing-card {
      position: fixed;
      top: calc(1rem + env(safe-area-inset-top));
      right: 1rem;
      background: var(--glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 0.9rem 1.2rem;
      box-shadow: 0 12px 35px rgba(0,0,0,0.5);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.8s ease;
      width: fit-content;
      min-width: 180px;
      max-width: calc(100vw - 2rem);
      text-align: center;
    }
    .now-playing-card.visible { opacity: 1; transform: translateY(0); }
    .np-label { font-size: 0.75rem; color: var(--text-muted); opacity: 0.7; margin-bottom: 0.4rem; }
    .np-title { font-size: clamp(0.95rem,3vw,1.1rem); font-weight: 600; color: var(--text); }
    .np-artist { font-size: clamp(0.85rem,2.8vw,0.95rem); font-style: italic; color: var(--accent2); opacity: 0.9; }
  </style>
</head>
<body>

  <div class="stars-bg" id="stars-bg"></div>
  <div class="bg-blob blob1"></div>
  <div class="bg-blob blob2"></div>
  <div class="space-drift" id="space-drift"></div>

  <div class="container">
    <div class="card">
      <div class="error-code">404</div>
      <h1>Oops~ Lost in the Universe ♡</h1>
      <p>You're drifting through endless space...<br>This page got swallowed by a cute black hole or something.</p>
      <a href="/" class="btn-home"><i class="fas fa-home"></i> Beam Me Home</a>

      <footer>
        made with <span class="heart">♡</span> for the cutest Femboys in The Universe
      </footer>
    </div>
  </div>

  <div id="now-playing" class="now-playing-card">
    <div class="np-label">now drifting to</div>
    <div class="np-title">Weightless</div>
    <div class="np-artist">Marconi Union</div>
  </div>

  <audio id="bgm" loop autoplay preload="auto">
    <source src="404.mp3" type="audio/mpeg">
  </audio>

  <script>
    // Starfield
    const starsBg = document.getElementById('stars-bg');
    const layerCount = 3;
    const starsPerLayer = 150;

    for (let layer = 1; layer <= layerCount; layer++) {
      const field = document.createElement('div');
      field.className = 'star-field';
      field.style.animationDuration = `${50 + layer * 20}s`;

      for (let i = 0; i < starsPerLayer; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 2.5 + 0.5;
        star.style.width = star.style.height = `${size}px`;
        const x = Math.random() * 200 - 100;
        const y = Math.random() * 200 - 100;
        const z = Math.random() * 1000;
        star.style.transform = `translate3d(${x}vw, ${y}vh, ${z}px)`;
        star.style.opacity = Math.random() * 0.8 + 0.2;
        field.appendChild(star);
      }
      starsBg.appendChild(field);
    }

    // Bass pulsing
    const audio = document.getElementById('bgm');
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaElementSource(audio);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.75;
    source.connect(analyser);
    analyser.connect(audioCtx.destination);

    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);

    const blob1 = document.querySelector('.blob1');
    const blob2 = document.querySelector('.blob2');

    function pulseBlobs() {
      requestAnimationFrame(pulseBlobs);
      analyser.getByteFrequencyData(dataArray);
      let bass = 0;
      const bassBins = 12;
      for (let i = 0; i < bassBins; i++) bass += dataArray[i];
      bass = bass / bassBins / 255;
      const bassBoost = Math.pow(bass, 1.3);
      const targetOpacity = 0.25 + 0.30 * bassBoost;
      blob1.style.opacity = blob1.style.opacity * 0.75 + targetOpacity * 0.25;
      blob2.style.opacity = blob2.style.opacity * 0.75 + targetOpacity * 0.25;
    }

    // Drifting elements - replace these URLs with ones you download!
    const driftContainer = document.getElementById('space-drift');
    const nebulae = [
      'https://static.vecteezy.com/system/resources/thumbnails/055/083/329/small_2x/vibrant-explosion-of-colorful-nebula-like-clouds-blending-shades-of-orange-purple-and-pink-against-a-transparent-background-symbolizing-creativity-png.png',
      'https://static.vecteezy.com/system/resources/thumbnails/058/261/346/small_2x/abstract-brush-stroke-galaxy-overlay-on-transparent-background-with-pink-blue-and-purple-nebula-cosmic-dust-starfield-png.png',
      'https://e7.pngegg.com/pngimages/469/468/png-clipart-purple-and-pink-abstract-painting-sky-computer-pattern-blue-and-purple-nebula-space-universe-purple-texture.png'
    ];

    const asteroids = [
      'https://media.istockphoto.com/id/1306547929/vector/asteroids-isolated-on-white.jpg?s=612x612&w=0&k=20&c=IFiL1SlJOd5N0KaHUSdAv5qxRG-7z8IFRdKadbjaUyQ=',
      'https://www.nicepng.com/png/detail/158-1581217_asteroid-clipart-round-boulder-asteroid-sprite-8-bit.png',
      'https://static.vecteezy.com/system/resources/previews/049/735/804/non_2x/ice-asteroid-isolated-on-transparent-background-free-png.png'
    ];

    function createDrifter(type, srcs) {
      const img = document.createElement('img');
      img.src = srcs[Math.floor(Math.random() * srcs.length)];
      img.className = type;
      const size = Math.random() * 600 + 300;
      img.style.width = img.style.height = `${size}px`;
      img.style.top = `${Math.random() * 100}vh`;
      img.style.left = `${Math.random() * 100}vw`;
      const duration = Math.random() * 100 + 80;
      img.style.animationDuration = `${duration}s`;
      driftContainer.appendChild(img);
    }

    for (let i = 0; i < 5; i++) createDrifter('nebula', nebulae);
    for (let i = 0; i < 8; i++) createDrifter('asteroid', asteroids);

    // Start on load
    window.addEventListener('load', () => {
      setTimeout(() => document.getElementById('now-playing').classList.add('visible'), 1000);
      audio.volume = 0.4;
      audio.play().catch(() => {});
      audioCtx.resume().then(pulseBlobs);
    });
  </script>
</body>
</html>
